<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office AI 助手</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="js/app-config.js"></script>
  <script src="js/ppt-engine.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --line: #d6dde8;
      --text: #172033;
      --muted: #61708a;
      --brand: #1765ff;
      --brand-strong: #0c4fd4;
      --ok: #0c8a5a;
      --warn: #d97706;
      --danger: #c2410c;
      --shadow: 0 18px 44px rgba(20, 38, 63, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(23, 101, 255, 0.10), transparent 26%),
        linear-gradient(180deg, #f7f9fd 0%, #eef3fa 100%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 10px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    button:hover {
      border-color: #9caaca;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .primary:hover {
      background: var(--brand-strong);
      border-color: var(--brand-strong);
    }

    .active {
      border-color: var(--brand);
      color: var(--brand);
      background: rgba(23, 101, 255, 0.08);
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(23, 101, 255, 0.12);
    }

    textarea {
      min-height: 164px;
      resize: vertical;
      line-height: 1.6;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(214, 221, 232, 0.9);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1765ff, #26a7ff);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(23, 101, 255, 0.28);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--warn);
    }

    .dot.ok { background: var(--ok); }

    .workspace {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(340px, 1fr) minmax(280px, 360px);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(214, 221, 232, 0.92);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfcfe 0%, #f4f7fb 100%);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
    }

    .panel-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .utility-row,
    .result-actions,
    .auth-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result-box {
      min-height: 440px;
      white-space: pre-wrap;
      line-height: 1.65;
      border: 1px dashed #bfd0ea;
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(180deg, #fcfdff 0%, #f7faff 100%);
      overflow: auto;
    }

    .result-box.empty {
      color: var(--muted);
    }

    .footer {
      padding: 12px 18px 18px;
    }

    .footer-card {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
    }

    .footer-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .spinner-overlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(12, 20, 34, 0.16);
      backdrop-filter: blur(4px);
      z-index: 9;
    }

    .spinner-overlay.show {
      display: grid;
    }

    .spinner-card {
      min-width: 180px;
      padding: 18px 20px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 3px solid rgba(23, 101, 255, 0.18);
      border-top-color: var(--brand);
      animation: spin 0.8s linear infinite;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      min-width: 220px;
      max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: 14px;
      color: #fff;
      background: rgba(23, 32, 51, 0.92);
      box-shadow: var(--shadow);
      transform: translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.ok { background: rgba(12, 138, 90, 0.94); }
    .toast.error { background: rgba(194, 65, 12, 0.96); }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1040px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .result-box {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>Office AI 助手</h1>
          <div class="subtitle" id="runtimeText">正在初始化</div>
        </div>
      </div>
      <div class="status-row">
        <div class="pill"><span>宿主</span><strong id="hostText">-</strong></div>
        <div class="pill"><span class="dot" id="serverDot"></span><span id="modeText">直连模式</span></div>
      </div>
    </header>

    <main class="workspace">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">输入与操作</div>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="topicInput">主题或任务指令</label>
            <input id="topicInput" placeholder="例如：AI 在企业知识管理中的应用" />
          </div>

          <div class="field">
            <label for="contextInput">上下文 / 幻灯片内容</label>
            <textarea id="contextInput" placeholder="粘贴当前页内容，或点击“读取选中”从 PowerPoint 获取文字。"></textarea>
          </div>

          <div class="utility-row">
            <button id="readSelectionBtn">读取选中</button>
            <button id="clearInputBtn">清空输入</button>
          </div>

          <div class="action-grid">
            <button data-action="outline" class="primary">生成大纲</button>
            <button data-action="full">完整内容</button>
            <button data-action="slide">单页内容</button>
            <button data-action="chat">自由提问</button>
            <button data-action="polish">精修润色</button>
            <button data-action="expand">内容扩展</button>
            <button data-action="condense">精简缩写</button>
            <button data-action="translate">中英互译</button>
            <button data-action="notes">演讲备注</button>
            <button data-action="design">设计建议</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">生成结果</div>
          <div class="subtitle">默认免配置可生成草稿；配置 API Key 后升级为 AI</div>
        </div>
        <div class="panel-body">
          <div class="result-box empty" id="resultBox">AI 生成内容会显示在这里。</div>
          <div class="result-actions">
            <button id="copyBtn">复制结果</button>
            <button id="writeBackBtn">写回 Office</button>
            <button id="saveDocBtn">保存文档</button>
            <button id="clearResultBtn">清空结果</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">连接与配置</div>
          <button id="checkBtn">检查连接</button>
        </div>
        <div class="panel-body">
          <div class="segmented">
            <button id="directModeBtn" class="active">直连模式</button>
            <button id="proxyModeBtn">服务端模式</button>
          </div>

          <div class="field">
            <label for="serverUrlInput">服务端地址</label>
            <input id="serverUrlInput" placeholder="https://your-api.example.com" />
          </div>

          <div class="field">
            <label for="providerSelect">生成模式 / AI 服务商</label>
            <select id="providerSelect"></select>
          </div>

          <div class="field">
            <label for="styleSelect">风格</label>
            <select id="styleSelect"></select>
          </div>

          <div class="field">
            <label for="modelInput">模型名称</label>
            <input id="modelInput" placeholder="留空时使用默认模型" />
          </div>

          <div class="field">
            <label for="endpointInput">自定义接口地址</label>
            <input id="endpointInput" placeholder="可选，覆盖默认接口地址" />
          </div>

          <div class="field">
            <label for="apiKeyInput">API Key</label>
            <input id="apiKeyInput" type="password" placeholder="免配置模板不用填；云端 AI 需要填写" />
          </div>

          <button id="saveSettingsBtn" class="primary">保存配置</button>

          <div class="subtitle" id="configHint">
            第一次使用建议保持“免配置模板”，先生成草稿并写回 PPT。需要真正 AI 时再选择 Gemini、DeepSeek、OpenAI 等并填写 API Key。
          </div>

          <div class="field">
            <label for="usernameInput">账号</label>
            <input id="usernameInput" placeholder="服务端用户名" />
          </div>

          <div class="field">
            <label for="passwordInput">密码</label>
            <input id="passwordInput" type="password" placeholder="至少 6 位" />
          </div>

          <div class="auth-row">
            <button id="loginBtn">登录</button>
            <button id="registerBtn">注册</button>
            <button id="logoutBtn">退出</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-card">
        <div>
          <strong>Office AI Assistant</strong>
          <div class="footer-meta">先在 PPT 中选中一个文本框，再点击“写回 Office”可把结果插入当前页</div>
        </div>
        <div id="footerStatus">就绪</div>
      </div>
    </footer>
  </div>

  <div class="spinner-overlay" id="spinnerOverlay">
    <div class="spinner-card">
      <div class="spinner"></div>
      <div>请稍候，正在处理...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const state = { result: '', busy: false };

    function showToast(message, type = '') {
      const toast = $('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => {
        toast.className = 'toast';
      }, 2800);
    }

    function setBusy(busy, label = '处理中') {
      state.busy = busy;
      $('footerStatus').textContent = busy ? label : '就绪';
      $('spinnerOverlay').classList.toggle('show', busy);
      document.querySelectorAll('button').forEach((button) => {
        if (button.id !== 'logoutBtn') {
          button.disabled = busy;
        }
      });
    }

    function setResult(text) {
      state.result = text || '';
      const box = $('resultBox');
      box.textContent = state.result || 'AI 生成内容会显示在这里。';
      box.classList.toggle('empty', !state.result);
    }

    function currentText() {
      return $('contextInput').value.trim() || $('topicInput').value.trim();
    }

    function refreshMode() {
      const mode = PPTEngine.getMode();
      const settings = PPTEngine.getSettings();
      const isAutoProxy = mode.mode === 'direct'
        && Boolean(mode.serverUrl)
        && !['local', 'ollama'].includes(settings.provider);
      $('modeText').textContent = mode.mode === 'proxy'
        ? (mode.authenticated ? '服务端已登录' : '服务端未登录')
        : isAutoProxy
          ? '本地代理'
          : '直连模式';
      $('serverDot').classList.toggle('ok', isAutoProxy || (mode.mode === 'proxy' && mode.authenticated));
      $('directModeBtn').classList.toggle('active', mode.mode === 'direct');
      $('proxyModeBtn').classList.toggle('active', mode.mode === 'proxy');
      $('serverUrlInput').value = mode.serverUrl;
    }

    function loadSettingsToForm() {
      const settings = PPTEngine.getSettings();
      $('providerSelect').value = settings.provider;
      $('styleSelect').value = settings.style;
      $('modelInput').value = settings.model || '';
      $('endpointInput').value = settings.endpoint || '';
      $('apiKeyInput').value = settings.apikey || '';
      refreshConfigHint(settings.provider);
    }

    function refreshConfigHint(provider) {
      const isLocal = provider === 'local';
      $('apiKeyInput').disabled = isLocal;
      $('endpointInput').disabled = isLocal;
      $('modelInput').disabled = isLocal;
      $('configHint').textContent = isLocal
        ? '当前是免配置模板模式：不需要 API Key，可以立即生成 PPT 草稿、备注和设计建议。'
        : '当前是云端 AI 模式：在本地加载项中会自动通过 http://localhost:3456 代理调用，避免 Office 直接请求 DeepSeek 被拦。';
    }

    function saveSettingsFromForm() {
      const settings = PPTEngine.saveSettings({
        provider: $('providerSelect').value,
        style: $('styleSelect').value,
        model: $('modelInput').value.trim(),
        endpoint: $('endpointInput').value.trim(),
        apikey: $('apiKeyInput').value.trim(),
      });

      if (PPTEngine.getMode().mode === 'proxy') {
        PPTEngine.useServer($('serverUrlInput').value.trim());
      }

      loadSettingsToForm();
      refreshMode();
      return settings;
    }

    async function runAction(action) {
      saveSettingsFromForm();
      const topic = $('topicInput').value.trim();
      const text = currentText();
      const needsTopic = ['outline', 'full'];
      const needsText = ['polish', 'expand', 'condense', 'translate', 'notes', 'design', 'chat'];

      if (needsTopic.includes(action) && !topic) {
        showToast('请先输入 PPT 主题', 'error');
        return;
      }
      if (needsText.includes(action) && !text) {
        showToast('请先输入或读取待处理内容', 'error');
        return;
      }

      const actions = {
        outline: () => PPTEngine.generateOutline(topic),
        full: () => PPTEngine.generateFullContent(topic),
        slide: () => PPTEngine.generateSlideContent(topic || text),
        polish: () => PPTEngine.polishText(text),
        expand: () => PPTEngine.expandContent(text),
        condense: () => PPTEngine.condenseContent(text),
        translate: () => PPTEngine.translate(text),
        notes: () => PPTEngine.generateSpeakerNotes(text),
        design: () => PPTEngine.getDesignTips(text),
        chat: () => PPTEngine.chat(topic || text, $('contextInput').value.trim()),
      };

      try {
        setBusy(true, 'AI 正在生成');
        const result = await actions[action]();
        setResult(result);
        showToast('已生成', 'ok');
      } catch (error) {
        showToast(error.message || '生成失败', 'error');
      } finally {
        setBusy(false);
      }
    }

    async function initApp() {
      PPTEngine.getProviders().forEach((provider) => {
        const option = document.createElement('option');
        option.value = provider.id;
        option.textContent = provider.name || provider.id;
        $('providerSelect').appendChild(option);
      });

      PPTEngine.getStyles().forEach((style) => {
        const option = document.createElement('option');
        option.value = style.id;
        option.textContent = style.label;
        $('styleSelect').appendChild(option);
      });

      const info = await PPTEngine.init();
      $('hostText').textContent = info.host;
      $('runtimeText').textContent = info.host === 'Browser' ? '网页版编辑模式' : `${info.host} 插件模式`;
      $('writeBackBtn').disabled = info.host === 'Browser';
      $('readSelectionBtn').disabled = info.host === 'Browser';
      loadSettingsToForm();
      refreshMode();
      setResult('');
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      button.addEventListener('click', () => runAction(button.dataset.action));
    });

    $('readSelectionBtn').addEventListener('click', async () => {
      try {
        const text = await PPTEngine.getSelection();
        if (!text) {
          showToast('没有读取到选中文字', 'error');
          return;
        }
        $('contextInput').value = text;
        showToast('已读取选中文字', 'ok');
      } catch (error) {
        showToast(error.message || '读取失败', 'error');
      }
    });

    $('writeBackBtn').addEventListener('click', async () => {
      if (!state.result) {
        showToast('没有可写回的结果', 'error');
        return;
      }
      try {
        await PPTEngine.writeToOffice(state.result);
        showToast('已写回 Office', 'ok');
      } catch (error) {
        showToast(error.message || '写回失败', 'error');
      }
    });

    $('copyBtn').addEventListener('click', async () => {
      if (!state.result) {
        return;
      }
      await navigator.clipboard.writeText(state.result);
      showToast('已复制结果', 'ok');
    });

    $('clearResultBtn').addEventListener('click', () => setResult(''));
    $('clearInputBtn').addEventListener('click', () => {
      $('topicInput').value = '';
      $('contextInput').value = '';
    });

    $('saveSettingsBtn').addEventListener('click', () => {
      saveSettingsFromForm();
      showToast('配置已保存', 'ok');
    });

    $('providerSelect').addEventListener('change', () => {
      refreshConfigHint($('providerSelect').value);
      refreshMode();
    });

    $('directModeBtn').addEventListener('click', () => {
      PPTEngine.useDirect();
      refreshMode();
      showToast('已切换到直连模式', 'ok');
    });

    $('proxyModeBtn').addEventListener('click', () => {
      PPTEngine.useServer($('serverUrlInput').value.trim());
      refreshMode();
      showToast('已切换到服务端模式', 'ok');
    });

    $('loginBtn').addEventListener('click', async () => {
      try {
        setBusy(true, '正在登录');
        PPTEngine.useServer($('serverUrlInput').value.trim());
        await PPTEngine.login($('usernameInput').value.trim(), $('passwordInput').value);
        refreshMode();
        showToast('登录成功', 'ok');
      } catch (error) {
        showToast(error.message || '登录失败', 'error');
      } finally {
        setBusy(false);
      }
    });

    $('registerBtn').addEventListener('click', async () => {
      try {
        setBusy(true, '正在注册');
        PPTEngine.useServer($('serverUrlInput').value.trim());
        await PPTEngine.register($('usernameInput').value.trim(), $('passwordInput').value);
        refreshMode();
        showToast('注册成功', 'ok');
      } catch (error) {
        showToast(error.message || '注册失败', 'error');
      } finally {
        setBusy(false);
      }
    });

    $('logoutBtn').addEventListener('click', () => {
      PPTEngine.logout();
      refreshMode();
      showToast('已退出', 'ok');
    });

    $('checkBtn').addEventListener('click', async () => {
      try {
        saveSettingsFromForm();
        setBusy(true, '正在检查连接');
        const ok = await PPTEngine.checkConnection();
        showToast(ok ? '连接可用' : '连接不可用，请检查配置', ok ? 'ok' : 'error');
      } finally {
        setBusy(false);
      }
    });

    $('saveDocBtn').addEventListener('click', async () => {
      if (!state.result) {
        showToast('没有可保存的结果', 'error');
        return;
      }
      try {
        const title = $('topicInput').value.trim() || 'AI 生成内容';
        await PPTEngine.createDocument(title, 'slides', state.result, state.result.slice(0, 160));
        showToast('已保存到服务端文档', 'ok');
      } catch (error) {
        showToast(error.message || '保存失败，请确认已登录服务端模式', 'error');
      }
    });

    initApp().catch((error) => showToast(error.message || '初始化失败', 'error'));
  </script>
</body>
</html>
