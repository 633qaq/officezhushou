<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPT 助手 - 前端模板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="js/ppt-engine.js"></script>
  <!-- 
    ═══════════════════════════════════════════
     前端只需引入 ppt-engine.js，然后调用：
       PPTEngine.init()
       PPTEngine.generateOutline(topic)
       PPTEngine.polishText(text)
       PPTEngine.writeToOffice(text)
       ... 等等

</head>
<body class="bg-gray-50 h-screen flex flex-col">

  <div id="app" class="flex-1 flex items-center justify-center">
    <div class="text-center space-y-4">
      <h1 class="text-3xl font-bold">📊 PPT 助手已就绪</h1>
      <p class="text-gray-500">引擎已加载，可以开始构建前端</p>
      <code class="bg-gray-100 px-4 py-2 rounded text-sm">PPTEngine.init().then(r => console.log(r))</code>
    </div>
  </div>
  <!-- 你自己的前端代码放这里 👆 -->

  <script>
    // 初始化引擎（只需一行）
    PPTEngine.init({
      onReady: ({ host, settings }) => {
        console.log('✅ PPTEngine ready', host, settings);
        // 在这里渲染你的前端界面
      }
    });

</body>
</html>
